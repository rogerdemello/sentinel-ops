server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml text/xml application/wasm;
    gzip_min_length 1024;

    # SPA: serve index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API + health to the backend service.
    # BACKEND_ORIGIN is substituted by nginx's envsubst at container start
    # (default http://backend:8000 for docker-compose; the backend's public URL on Render).
    location /api/ {
        proxy_pass ${BACKEND_ORIGIN};
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /health {
        proxy_pass ${BACKEND_ORIGIN}/health;
    }

    # WebSocket live stream.
    location /ws/ {
        proxy_pass ${BACKEND_ORIGIN};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}
