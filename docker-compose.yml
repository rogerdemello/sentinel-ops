# SentinelOps AI — full stack. `docker compose up --build`
# Frontend (nginx) on :8080 proxies /api + /ws to the backend on :8000.
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      CORS_ORIGINS: '["http://localhost:8080"]'
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    environment:
      BACKEND_ORIGIN: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
