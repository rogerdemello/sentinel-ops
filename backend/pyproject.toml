[project]
name = "sentinelops-backend"
version = "0.1.0"
description = "SentinelOps AI — autonomous incident prediction & prevention platform (backend)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "networkx>=3.3",
    "psutil>=5.9",
    "httpx>=0.27",
    "supabase>=2.5",
    "psycopg[binary]>=3.1",
    "openai>=1.40",
    "google-generativeai>=0.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]
neo4j = ["neo4j>=5.0"]
prophet = ["prophet>=1.1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# conftest intentionally neutralizes env vars before importing app modules.
"tests/conftest.py" = ["E402"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
